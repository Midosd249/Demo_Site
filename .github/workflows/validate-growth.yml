name: Validate Growth Platform
on:
  push:
    branches: [main, 'refactor/website-growth-platform']
  pull_request:
    branches: [main]
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Validate JavaScript syntax
        run: node --check platform.js
      - name: Validate required files
        run: test -s index.html && test -s platform.css && test -s platform.js && test -s growth_platform_migration.sql
